<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Registrations (private)</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<style>
  body{background:var(--paper)}
  .adm{max-width:1280px;margin:0 auto;padding:2rem var(--gutter) 4rem}
  .adm h1{font-size:clamp(2.4rem,1.5rem + 3vw,4rem);margin-bottom:.5rem}
  .adm__bar{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;margin:1.25rem 0}
  .adm table{width:100%;border-collapse:collapse;font-size:.9rem;background:#fff}
  .adm th,.adm td{text-align:left;padding:.6rem .7rem;border-bottom:1px solid var(--line-light);vertical-align:top}
  .adm th{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;background:var(--paper-2)}
  .adm .scroll{overflow-x:auto;border:1px solid var(--line-light)}
  .pill{display:inline-block;padding:.15rem .55rem;border-radius:2px;font-weight:700;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em}
  .pill--paid{background:#1c1c1c;color:#fff}.pill--pending{background:var(--accent);color:#fff}
  .adm button.sm{min-height:36px;padding:.25rem .7rem;font-weight:600;border:1px solid var(--ink);background:#fff;border-radius:2px}
  .detail{background:#fff;border:1px solid var(--line-light);border-top:4px solid var(--ink);padding:1.5rem;margin-top:1.5rem}
  .detail h2{font-size:2rem;margin-bottom:.75rem}
  .detail dl{display:grid;grid-template-columns:minmax(9rem,14rem) 1fr;gap:.35rem 1rem;margin:0 0 1.25rem}
  .detail dt{font-weight:700;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)}
  .detail dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
  .detail img.sigimg{max-width:420px;width:100%;border:1px solid var(--line-light);background:#fff}
  .detail .wv p{margin:.4rem 0;font-size:.92rem}
  @media print{.adm__bar,.adm .scroll,.noprint,.site-hdr{display:none!important}.detail{border:0;margin:0}}
</style>
</head>
<body class="on-light">
<main class="adm" id="main">
  <h1 class="display">Registrations</h1>
  <p class="muted">Private. Registrations are encrypted in storage and open only with the admin token. A registration is “paid” only after you record it here.</p>
  <form id="login" class="adm__bar" autocomplete="off">
    <label for="tok" class="sr-only">Admin token</label>
    <input id="tok" type="password" autocomplete="off" placeholder="Admin token" required style="min-height:48px;padding:.5rem .8rem;border:1.5px solid #a3a3a3;min-width:min(22rem,100%)">
    <button class="btn btn--dark" type="submit">Open</button>
    <span id="msg" role="status" class="muted"></span>
  </form>
  <div id="app" hidden>
    <div class="adm__bar">
      <button class="btn btn--ghost-dark" id="refresh" type="button">Refresh</button>
      <button class="btn btn--ghost-dark" id="csv" type="button">Download CSV</button>
      <span id="count" class="muted"></span>
    </div>
    <div class="scroll"><table><thead><tr><th>Reference</th><th>Athlete</th><th>Grade</th><th>Parent</th><th>Contact</th><th>Shirt</th><th>Registered</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
    <section id="detail" class="detail" hidden aria-live="polite"></section>
  </div>
</main>
<script src="assets/js/admin.js"></script>
</body>
</html>
